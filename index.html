// ---- src/sim/collision.js ----
// Swept circle collision helpers (pure functions, no rendering state).
var DX = window.DX = window.DX || {};

DX.Collide = (function () {
  var EPS = 1e-9;

  // Sweep a circle centre from (px,py) by (dx,dy) against an axis-aligned
  // rectangle [x0,x1]x[y0,y1] inflated by radius r with rounded corners.
  // Returns null or {t, nx, ny, corner}. Only reports hits while approaching.
  function sweepRect(px, py, dx, dy, r, x0, y0, x1, y1) {
    var ex0 = x0 - r, ex1 = x1 + r, ey0 = y0 - r, ey1 = y1 + r;
    var tmin = 0, tmax = 1, nx = 0, ny = 0, t1, t2, s;
    // slab X
    if (Math.abs(dx) < EPS) {
      if (px < ex0 || px > ex1) return null;
    } else {
      t1 = (ex0 - px) / dx; t2 = (ex1 - px) / dx; s = -1;
      if (t1 > t2) { var tt = t1; t1 = t2; t2 = tt; s = 1; }
      if (t1 > tmin) { tmin = t1; nx = s; ny = 0; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    if (Math.abs(dy) < EPS) {
      if (py < ey0 || py > ey1) return null;
    } else {
      t1 = (ey0 - py) / dy; t2 = (ey1 - py) / dy; s = -1;
      if (t1 > t2) { var tu = t1; t1 = t2; t2 = tu; s = 1; }
      if (t1 > tmin) { tmin = t1; nx = 0; ny = s; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    if (nx === 0 && ny === 0) return null; // started inside inflated box; handled by depenetration
    var hx = px + dx * tmin, hy = py + dy * tmin;
    // corner region?
    var inX = hx >= x0 && hx <= x1, inY = hy >= y0 && hy <= y1;
    if (inX || inY) {
      if (dx * nx + dy * ny >= 0) return null;
      return { t: tmin, nx: nx, ny: ny, corner: false };
    }
    var cx = hx < x0 ? x0 : x1, cy = hy < y0 ? y0 : y1;
    return sweepCircle(px, py, dx, dy, r, cx, cy);
  }

  function sweepCircle(px, py, dx, dy, r, cx, cy) {
    var fx = px - cx, fy = py - cy;
    var a = dx * dx + dy * dy;
    if (a < EPS) return null;
    var b = 2 * (fx * dx + fy * dy);
    var c = fx * fx + fy * fy - r * r;
    var disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    var sq = Math.sqrt(disc);
    var t = (-b - sq) / (2 * a);
    if (t < 0 || t > 1) return null;
    var hx = px + dx * t - cx, hy = py + dy * t - cy;
    var len = Math.sqrt(hx * hx + hy * hy) || 1;
    var nx = hx / len, ny = hy / len;
    if (dx * nx + dy * ny >= 0) return null;
    return { t: t, nx: nx, ny: ny, corner: true };
  }

  // Penetration test: circle vs rect. Returns push vector or null.
  function penetration(px, py, r, x0, y0, x1, y1) {
    var cx = Math.max(x0, Math.min(px, x1)), cy = Math.max(y0, Math.min(py, y1));
    var ddx = px - cx, ddy = py - cy, d2 = ddx * ddx + ddy * ddy;
    if (d2 >= r * r) return null;
    if (d2 > EPS) {
      var d = Math.sqrt(d2);
      return { x: ddx / d * (r - d), y: ddy / d * (r - d) };
    }
    // centre inside rect: push out along least-penetration axis
    var l = px - x0 + r, rr = x1 - px + r, t = py - y0 + r, b = y1 - py + r;
    var m = Math.min(l, rr, t, b);
    if (m === l) return { x: -l, y: 0 };
    if (m === rr) return { x: rr, y: 0 };
    if (m === t) return { x: 0, y: -t };
    return { x: 0, y: b };
  }

  function rectsOverlap(a, b) {
    return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  }

  return { sweepRect: sweepRect, sweepCircle: sweepCircle, penetration: penetration, rectsOverlap: rectsOverlap };
})();

// Small seedable PRNG (mulberry32) so runs are reproducible for debugging.
DX.RNG = function (seed) {
  var s = (seed >>> 0) || 1;
  var f = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// Procedurally drawn power-up icon atlas (newly created artwork, modelled on the
// symbol vocabulary of the original menu legend: blue = helpful, red = harmful,

var DX = window.DX = window.DX || {};

DX.Icons = (function () {
  var ORDER = ['thru', 'setoff', 'fireball', 'shoot', 'grab', 'life', 'warp', 'zap', 'slow', 'multiexp',
               'kill', 'miniball', 'fast', 'minipad', 'falling', 'expand', 'shrink', 'split', 'mega', 'eight'];
  var CELL = 128, COLS = 5, ROWS = 4;
  var GROUP = {
    blue: ['#3a5cff', '#1428c0', '#0a1470'],
    red:  ['#ff4a4a', '#c41414', '#600808'],
    grey: ['#e6e9f0', '#9aa0ac', '#4a4e58']

    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }

    var gr = g.createLinearGradient(0, y, 0, y + h);

    g.fillStyle = gr; rr(g, x, y, w, h, h / 2); g.fill();

  }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function brick(g, x, y, w, h, col) {
    g.fillStyle = col; g.fillRect(x, y, w, h);

    g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(x, y + h - 3, w, 3); g.fillRect(x + w - 3, y, 3, h);
  }
  function arrow(g, x0, y0, x1, y1, head, col, wid) {

    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var a = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath(); g.moveTo(x1 + Math.cos(a) * head * 0.6, y1 + Math.sin(a) * head * 0.6);
    g.lineTo(x1 + Math.cos(a + 2.5) * head, y1 + Math.sin(a + 2.5) * head);
    g.lineTo(x1 + Math.cos(a - 2.5) * head, y1 + Math.sin(a - 2.5) * head); g.closePath(); g.fill();
  }
  function outlineText(g, t, x, y, size, fill) {
    g.font = '900 ' + size + 'px "Arial Black", Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.strokeText(t, x, y);
    g.fillStyle = fill || '#fff'; g.fillText(t, x, y);
  }

  var DRAW = {
    thru: function (g) { brick(g, 26, 56, 76, 30, '#d02020'); arrow(g, 30, 104, 96, 26, 26, '#fff', 9); },
    setoff: function (g) {
      g.save(); g.translate(64, 72); g.rotate(-0.35); brick(g, -12, -30, 24, 60, '#d81818'); g.restore();
      g.strokeStyle = '#ffd040'; g.lineWidth = 4; g.beginPath(); g.moveTo(58, 40); g.quadraticCurveTo(66, 24, 80, 22); g.stroke();
      star(g, 84, 22, 12, '#fff6a0');
    },
    fireball: function (g) {
      var gr = g.createLinearGradient(20, 100, 90, 40); gr.addColorStop(0, 'rgba(255,60,0,0)'); gr.addColorStop(1, '#ffb020');
      g.fillStyle = gr; g.beginPath(); g.moveTo(14, 112); g.quadraticCurveTo(40, 52, 70, 38); g.lineTo(96, 66); g.quadraticCurveTo(60, 80, 14, 112); g.fill();
      ball(g, 82, 50, 20, '#ff8a20');
    },
    shoot: function (g) {
      g.fillStyle = '#ff3030'; g.fillRect(30, 30, 10, 40); g.fillRect(88, 30, 10, 40);
      g.fillStyle = '#ffe0a0'; g.fillRect(32, 14, 6, 12); g.fillRect(90, 14, 6, 12); bar(g, 20, 76, 88, 22);
    },
    grab: function (g) {

      g.strokeStyle = '#40ff90'; g.lineWidth = 6; g.beginPath(); g.arc(64, 70, 26, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    },
    life: function (g) { outlineText(g, '+1', 64, 66, 64); },
    warp: function (g) {
      var cols = ['#ff3030', '#ffcc20', '#30d040', '#3060ff', '#c040ff'];
      for (var i = 0; i < 5; i++) for (var j = 0; j < 2; j++) brick(g, 18 + i * 19, 22 + j * 14, 18, 13, cols[(i + j) % 5]);
      g.fillStyle = '#fff'; g.font = '900 30px "Arial Black", sans-serif'; g.textAlign = 'center'; g.fillText('»', 64, 96);

    },
    zap: function (g) {

    },
    slow: function (g) {
      ball(g, 88, 84, 13);
      g.strokeStyle = '#7ad0ff'; g.lineCap = 'round';
      for (var i = 0; i < 4; i++) { g.lineWidth = 6 - i; g.globalAlpha = 1 - i * 0.2; g.beginPath(); g.arc(88, 84, 26 + i * 14, Math.PI * 1.02, Math.PI * 1.5); g.stroke(); }

    },
    multiexp: function (g) {
      g.fillStyle = '#ff9a20'; g.strokeStyle = '#7a3000'; g.lineWidth = 4;
      g.beginPath(); [[50, 20], [78, 20], [78, 50], [108, 50], [108, 78], [78, 78], [78, 108], [50, 108], [50, 78], [20, 78], [20, 50], [50, 50]].forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
      g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#ffe080'; g.fillRect(56, 26, 6, 76); g.fillRect(26, 56, 76, 6);
    },
    kill: function (g) {
      g.strokeStyle = '#fff'; g.lineWidth = 11; g.lineCap = 'round';
      g.beginPath(); g.moveTo(28, 76); g.lineTo(100, 112); g.moveTo(100, 76); g.lineTo(28, 112); g.stroke();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(64, 50, 30, 0, 6.2832); g.fill(); g.fillRect(48, 64, 32, 20);
      g.fillStyle = '#1a0000'; g.beginPath(); g.arc(52, 50, 9, 0, 6.2832); g.arc(76, 50, 9, 0, 6.2832); g.fill();
      g.beginPath(); g.moveTo(64, 60); g.lineTo(58, 70); g.lineTo(70, 70); g.fill();
      g.fillRect(54, 76, 4, 8); g.fillRect(62, 76, 4, 8); g.fillRect(70, 76, 4, 8);
    },
    miniball: function (g) { ball(g, 64, 64, 9); },
    fast: function (g) {
      g.fillStyle = '#ffe020'; g.strokeStyle = '#6a4a00'; g.lineWidth = 3;
      [24, 58].forEach(function (x) { g.beginPath(); g.moveTo(x, 28); g.lineTo(x + 26, 28); g.lineTo(x + 50, 64); g.lineTo(x + 26, 100); g.lineTo(x, 100); g.lineTo(x + 24, 64); g.closePath(); g.fill(); g.stroke(); });
    },
    minipad: function (g) { bar(g, 44, 56, 40, 16); },
    falling: function (g) {
      brick(g, 26, 22, 76, 34, '#a020c0'); arrow(g, 64, 62, 64, 108, 22, '#ffd020', 10);
    },
    expand: function (g) { arrow(g, 56, 64, 16, 64, 22, '#2050ff', 10); arrow(g, 72, 64, 112, 64, 22, '#2050ff', 10); },
    shrink: function (g) { arrow(g, 10, 64, 50, 64, 22, '#2050ff', 10); arrow(g, 118, 64, 78, 64, 22, '#2050ff', 10); },
    split: function (g) { ball(g, 64, 36, 15, '#50ff70'); ball(g, 40, 84, 15, '#50ff70'); ball(g, 88, 84, 15, '#50ff70');
      g.strokeStyle = '#205a20'; g.lineWidth = 4; g.beginPath(); g.moveTo(64, 52); g.lineTo(64, 64); g.lineTo(46, 72); g.moveTo(64, 64); g.lineTo(82, 72); g.stroke(); },
    mega: function (g) { ball(g, 64, 64, 36); },
    eight: function (g) { for (var i = 0; i < 8; i++) { var a = i / 8 * 6.2832; ball(g, 64 + Math.cos(a) * 34, 64 + Math.sin(a) * 34, 11, '#d0d4e0'); } ball(g, 64, 64, 9, '#7090ff'); }

// HD-2D renderer: orthographic, slightly tilted camera over a flat gameplay plane.
// Visual depth never feeds back into collision — it only reads simulation state.
var DX = window.DX = window.DX || {};

  this.canvas = canvas;
  this.settings = settings;
  this.cfg = DX.CONFIG;
  this.time = 0;
  this.shake = 0;
  this.shakeX = 0; this.shakeY = 0;
  this.view = { w: 1, h: 1, l: -400, r: 400, b: -300, t: 300, scale: 1 };
  this.particles = new DX.Particles(this);
  this.init();
};

(function (P) {
  var G = DX.GL;
  var FW = DX.CONFIG.field.width, FH = DX.CONFIG.field.height;

  function wy(y) { return FH / 2 - y; }

    var gl = this.gl, S = DX.Shaders;

    this.pShadow = G.program(gl, S.shadow.vs, S.shadow.fs);
    this.pSprite = G.program(gl, S.sprite.vs, S.sprite.fs);

    function v(sx, sy, inset, zm, nx, ny, nz) { bv.push(sx, sy, inset, zm, nx, ny, nz); return bv.length / 7 - 1; }
    function quad(a, b, c, d) { bi.push(a, b, c, a, c, d); }
    // front
    quad(v(-1, -1, 1, 1, 0, 0, 1), v(1, -1, 1, 1, 0, 0, 1), v(1, 1, 1, 1, 0, 0, 1), v(-1, 1, 1, 1, 0, 0, 1));

  };

  P.frame = function (now) {
    var dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    this.debug.tick(dt);
    var inGame = this.ui.screen === 'game';
    var g = inGame ? this.game : this.attract, alpha = 1;
    if (inGame) {
      if (!this.paused && !this.ui.overlay) {
        this.game.setPaddleTarget(this.input.paddleTarget(this.game.paddle.x, dt));
        alpha = this.game.advance(dt * this.slowmo);
      }
    } else {
      this.autopilot(this.attract, dt);
      alpha = this.attract.advance(dt);
    }
    var evs = g.events;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      this.renderer.onEvent(e, g);
      if (inGame) { this.audio.onEvent(e); this.ui.onEvent(e); this.debug.onEvent(e); this.onEvent(e); }
    }
    evs.length = 0;
    this.renderer.particles.update(dt * (inGame && (this.paused || this.ui.overlay === 'pause') ? 0 : 1));

    var desat = 0;
    if (g.phase === 'dying') desat = Math.min(1, (1.6 - g.phaseT) / 0.45);
    else if (g.phase === 'gameover') desat = 1;
    var px = g.paddle.x;
    if (inGame && !this.paused && !this.ui.overlay) { // render the freshest input for minimal latency
      var hw = g.paddle.w / 2;
      px = Math.max(hw, Math.min(DX.CONFIG.field.width - hw, g.paddle.target));
    }
    this.renderer.render(g, dt, alpha, px, { desat: desat, debugShowHidden: this.debug.on && this.debug.showHidden });
    this.ui.updateHover(this.input.mouseX, this.input.mouseY);
    this.ui.draw(dt);
    // original soundtrack: intro on the title, board-select and hi-score themes, 7 in-game tracks by board
    if (this.audio.ctx && this.audio.ctx.state === 'running') {
      var sc = this.ui.screen;
      var want = sc === 'game' ? 'sdxb_board' + ((this.game.orderPos % 7) + 1) : (sc === 'packs' ? 'select' : (sc === 'scores' ? 'scores' : 'title'));
      this.audio.playMusic(want);
    }
  };

  // simple demo player for the title screen background
  P.autopilot = function (g, dt) {
    if (g.phase === 'serve') { g._serveT = (g._serveT || 0) + dt; if (g._serveT > 0.8) { g._serveT = 0; g.action(); } }
    if (g.phase === 'gameover') { g.continueGame(); }
    if (g.phase === 'won') { g.newGame(g.order, 0); g.lives = 999; }
    var tgt = null, ty = -1;
    for (var i = 0; i < g.balls.length; i++) { var b = g.balls[i]; if (!b.stuck && b.vy > 0 && b.y > ty) { ty = b.y; tgt = b; } }
    if (tgt) {
      if (tgt.id !== g._aim || (g._dir || 0) <= 0) { g._aim = tgt.id; g._off = (g.rng() - 0.5) * g.paddle.w * 0.7; }
      g._dir = tgt.vy;
      g.setPaddleTarget(tgt.x - g._off);
    } else g._dir = -1;
    if (g.boardTime > 75 && g.phase === 'play') g.boardCleared(true); // keep the demo moving
  };

  P.onEvent = function (e) {
    var save = DX.Save.get();
    if (e.type === 'boardStart') {
      var gi = e.index;
      save.progress.reached = Math.max(save.progress.reached || 0, gi);
      this.game.boardStartScore = this.game.score;
      save.lastGame = { order: this.game.order, pos: this.game.orderPos, score: this.game.score, lives: this.game.lives, continues: this.game.continues };
      DX.Save.write();
    } else if (e.type === 'boardClear') {
      this.game.lastWarp = e.warp;
    } else if (e.type === 'gameOver') {
      this.ui.overlay = 'gameover'; this.input.setCapture(false);
      this.audio.onEvent(e);
    } else if (e.type === 'gameWon') {
      this.ui.overlay = 'won'; this.input.setCapture(false);
      save.lastGame = null; DX.Save.write();
    }
  };

  P.startPack = function (packId, pos) {
    var order = [];
    DX.BOARDS.forEach(function (b, i) { if (packId === 'all' || b.pack === packId) order.push(i); });
    this.startGame(order, pos || 0);
  };
  P.startAt = function (boardIndex) {
    this.startGame(DX.BOARDS.map(function (b, i) { return i; }), boardIndex);
  };
  P.startGame = function (order, pos) {
    this.audio.unlock();
    this.game = new DX.Game(this.seed++);
    this.game.newGame(order, pos);
    this.ui.screen = 'game'; this.ui.overlay = null; this.ui.popups = [];
    this.paused = false;
    this.renderer.particles.clear();
    if (this.settings.mouseCapture) this.input.setCapture(true);
    this.input.refreshMapping();
  };
  P.continueSaved = function () {
    var s = DX.Save.get().lastGame; if (!s) return;
    this.startGame(s.order, s.pos);
    this.game.score = s.score; this.game.boardStartScore = s.score; this.game.lives = s.lives; this.game.continues = s.continues;
  };
  P.pause = function () { if (this.ui.screen !== 'game') return; this.paused = true; this.ui.overlay = 'pause'; this.input.setCapture(false); };
  // Android back button (called from the APK's native wrapper)
  P.androidBack = function () {
    var ui = this.ui;
    if (ui.screen === 'game') {
      if (ui.overlay === 'pause') this.resume();
      else if (ui.overlay === 'confirmQuit') { ui.overlay = 'pause'; }
      else if (!ui.overlay) this.pause();
    } else if (ui.screen === 'options') ui.back();
    else if (ui.screen !== 'title') ui.screen = 'title';
    this.audio.play('menu');
  };
  P.autoPause = function () {
    if (this.ui.screen === 'game' && !this.ui.overlay && (this.game.phase === 'play' || this.game.phase === 'serve')) this.pause();
  };
  P.resume = function () {
    this.paused = false; this.ui.overlay = null;
    this.input.refreshMapping();
    if (this.settings.mouseCapture) this.input.setCapture(true);
  };
  P.restartBoard = function () {
    var sc = this.game.boardStartScore || 0;
    this.game.loadBoard(this.game.order[this.game.orderPos]);
    this.game.score = sc;
    this.renderer.particles.clear();
    this.resume();
  };
  P.continueGame = function () {
    if (this.game.continueGame()) { this.ui.overlay = null; this.paused = false; }
  };
  P.finishGame = function () {
    if (DX.Save.qualifies(this.game.score)) { this.ui.overlay = 'name'; this.ui.nameBuf = DX.Save.get().lastName || 'PLAYER'; return; }
    this.endGame();
  };
  P.submitName = function () {
    var name = (this.ui.nameBuf || 'PLAYER').trim() || 'PLAYER';
    var save = DX.Save.get(); save.lastName = name;
    DX.Save.addScore(name, this.game.score, 'Board ' + (this.game.orderPos + 1));
    this.endGame('scores');
  };
  P.endGame = function (to) {
    var save = DX.Save.get();
    if (this.game.phase === 'gameover' || this.game.phase === 'won') save.lastGame = null;
    DX.Save.write();
    this.game.phase = 'idle';
    this.ui.screen = to || 'title'; this.ui.overlay = null; this.paused = false;
    this.input.setCapture(false);
  };
  P.debugLoad = function (pos) {
    var g = this.game;
    if (pos < 0 || pos >= g.order.length) return;
    g.orderPos = pos; g.loadBoard(g.order[pos]);
    this.renderer.particles.clear();
  };
  P.toggleFullscreen = function () {
    if (!document.fullscreenElement) { var el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); }
    else if (document.exitFullscreen) document.exitFullscreen();
  };
  P.applySettings = function () {
    this.audio.applyVolumes();
    if (!this.settings.mouseCapture) this.input.setCapture(false);
    this.resize();
    DX.Save.write();
  };
})(DX.App.prototype);

window.addEventListener('load', function () {
  try { window.app = new DX.App(); }
  catch (err) {
    console.error(err);
    var m = document.getElementById('msg'); m.style.display = 'flex';
    m.textContent = 'Could not start: ' + err.message;
  }
});

</script>
<script>if (location.protocol.startsWith("http") && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
